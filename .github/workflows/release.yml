name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@dettalia'

      - name: Install dependencies
        run: npm ci

      # When changesets are pending on main, this opens/updates a "Version
      # Packages" PR (via version-script). Once that PR is merged and no
      # changesets remain, the next run of this workflow publishes to
      # GitHub Packages (via publish-script) and creates a GitHub Release
      # per package with the generated changelog.
      - name: Version or publish
        uses: changesets/action@v2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
