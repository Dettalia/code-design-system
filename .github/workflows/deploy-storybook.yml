name: Deploy Storybook

# GitHub Pages requires a public repo or a paid plan, and this repo is
# private on the free plan — so instead of deploying to Pages, this builds
# Storybook on every push to main and attaches it as a downloadable CI
# artifact. Download it from the workflow run's "Artifacts" section, unzip,
# and open index.html locally.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Storybook artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 30
