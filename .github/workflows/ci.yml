name: CI

on:
  pull_request:

jobs:
  ci:
    name: Typecheck, lint, test, and build Storybook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook

      # Standalone HTML pages (examples/), attached to the run so people
      # without a dev setup can review them: download "example-pages" from the
      # run's Artifacts section, unzip, and open <page>/index.html.
      - name: Build example pages
        run: |
          npm run example:card
          npm run example:meetings
          npm run example:companies

      - name: Upload example pages
        uses: actions/upload-artifact@v7
        with:
          name: example-pages
          path: examples/dist
          retention-days: 30
